name: Build All App Dists

on:
  workflow_dispatch:

jobs:
  build-all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout buildbot
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip python3-pil

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clone Union Miyoo Mini toolchain
        run: git clone --depth=1 https://github.com/XK9274/union-miyoomini-toolchain.git /tmp/union-miyoomini-toolchain

      - name: Build Union toolchain image (cached)
        uses: docker/build-push-action@v6
        with:
          context: /tmp/union-miyoomini-toolchain
          tags: miyoomini-toolchain:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build all packages
        run: scripts/build-all.sh

      - name: Upload individual app archives
        uses: actions/upload-artifact@v4
        with:
          name: app-dists
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Upload aggregate archive
        uses: actions/upload-artifact@v4
        with:
          name: all-app-dists
          path: dist/all-app-dists.zip
          if-no-files-found: error

