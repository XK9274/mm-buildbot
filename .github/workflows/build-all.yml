name: Build All App Dists

on:
  workflow_dispatch:

jobs:
  build-all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout buildbot
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip python3-pil

      - name: Build Union toolchain image
        uses: ./.github/actions/build-toolchain-image

      - name: Build all packages
        run: scripts/build-all.sh

      - name: Upload individual app archives
        uses: actions/upload-artifact@v4
        with:
          name: app-dists
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Upload aggregate archive
        uses: actions/upload-artifact@v4
        with:
          name: all-app-dists
          path: dist/all-app-dists.zip
          if-no-files-found: error

